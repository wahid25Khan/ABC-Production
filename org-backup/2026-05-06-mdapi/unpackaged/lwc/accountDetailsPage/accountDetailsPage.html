<template>
    <div class="account-details-page">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading account details" size="medium"></lightning-spinner>
        </template>

        <template if:false={isLoading}>
            <div class="page-header">
                <h1>{heroTitle}</h1>
            </div>

            <div class="section-tabs" role="tablist" aria-label="Account Details Sections">
                <template for:each={sectionTabs} for:item="tab">
                    <button
                        key={tab.id}
                        class={tab.className}
                        data-target={tab.id}
                        onclick={handleTabClick}
                        type="button"
                    >
                        {tab.label}
                    </button>
                </template>
            </div>

            <template if:true={statusMessage}>
                <output class={statusClass}>{statusMessage}</output>
            </template>

            <section class="detail-section" data-section="about-you" id="about-you">
                <div class="section-heading">
                    <h2>About You</h2>
                    <button class="edit-link" type="button" onclick={handleEditAbout}>Edit</button>
                </div>

                <template if:false={isEditingAbout}>
                    <div class="about-grid">
                        <div class="detail-row">
                            <div class="detail-label">Name</div>
                            <div class="detail-value">{displayName}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">Email</div>
                            <div class="detail-value">{displayEmail}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">Phone</div>
                            <div class="detail-value">{displayPhone}</div>
                        </div>
                    </div>
                </template>

                <template if:true={isEditingAbout}>
                    <div class="form-grid">
                        <label class="field">
                            <span>First Name</span>
                            <input data-field="firstName" type="text" value={aboutForm.firstName} oninput={handleAboutInput} />
                        </label>
                        <label class="field">
                            <span>Last Name</span>
                            <input data-field="lastName" type="text" value={aboutForm.lastName} oninput={handleAboutInput} />
                        </label>
                        <label class="field full-width">
                            <span>Email</span>
                            <input data-field="email" type="email" value={aboutForm.email} oninput={handleAboutInput} />
                        </label>
                        <label class="field full-width">
                            <span>Phone</span>
                            <input data-field="phone" type="tel" value={aboutForm.phone} oninput={handleAboutInput} />
                        </label>
                    </div>
                    <div class="button-row">
                        <button class="primary-button" type="button" onclick={handleSaveAbout} disabled={isSavingAbout}>Save Details</button>
                        <button class="secondary-button" type="button" onclick={handleCancelAbout}>Cancel</button>
                    </div>
                </template>
            </section>

            <section class="detail-section" data-section="password-security" id="password-security">
                <div class="section-heading">
                    <h2>Password &amp; Security</h2>
                </div>
                <div class="password-layout">
                    <div class="password-form">
                        <label class="field">
                            <span>Current Password *</span>
                            <input data-field="currentPassword" type="password" value={passwordForm.currentPassword} oninput={handlePasswordInput} />
                        </label>
                        <label class="field">
                            <span>New Password *</span>
                            <input data-field="newPassword" type="password" value={passwordForm.newPassword} oninput={handlePasswordInput} />
                        </label>
                        <label class="field">
                            <span>Confirm Password *</span>
                            <input data-field="confirmPassword" type="password" value={passwordForm.confirmPassword} oninput={handlePasswordInput} />
                        </label>
                        <button class="secondary-pill" type="button" onclick={handleSavePassword} disabled={isPasswordSubmitDisabled}>Update Password</button>
                    </div>
                    <div class="password-rules">
                        <div class="rules-title">Password requirements:</div>
                        <div class="rules-columns">
                            <ul>
                                <template for:each={passwordRequirements} for:item="requirement">
                                    <li key={requirement.label} class={requirement.className}>{requirement.label}</li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>

            <section class="detail-section" data-section="organization-details" id="organization-details">
                <div class="section-heading">
                    <h2>Organization Details</h2>
                </div>
                <div class="section-copy">{displayOrganization}</div>
                <button class="secondary-pill" type="button" onclick={openOrganizationModal}>{organizationButtonLabel}</button>
            </section>

            <section class="detail-section" data-section="shipping-address" id="shipping-address">
                <div class="section-heading">
                    <h2>Shipping Address</h2>
                </div>
                <div class="section-copy">{displayShippingAddress}</div>
                <button class="secondary-pill" type="button" onclick={openShippingModal}>{shippingButtonLabel}</button>
            </section>

            <section class="detail-section" data-section="payment-methods" id="payment-methods">
                <div class="section-heading">
                    <h2>Payment Methods</h2>
                </div>
                <div class="section-copy">{displayPaymentSummary}</div>
                <ul class="payment-list">
                    <li class="payment-option-row">
                        <label class="radio-label">
                            <input
                                type="radio"
                                name="accountPaymentType"
                                value="ach"
                                checked={isACH}
                                onchange={handlePaymentTypeChange}
                                class="radio-input"
                            />
                            <span>Pay with ACH</span>
                        </label>
                    </li>

                    <template if:true={isACH}>
                        <li class="payment-fields">
                            <div class="form-group">
                                <label for="achAccountHolder" class="form-label">Account Holders Name *</label>
                                <input
                                    id="achAccountHolder"
                                    type="text"
                                    class="form-input"
                                    data-field="achAccountHolder"
                                    value={paymentForm.achAccountHolder}
                                    oninput={handlePaymentInput}
                                    placeholder="Enter name as it appears on account"
                                />
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="achAccountNumber" class="form-label">Account Number *</label>
                                    <input
                                        id="achAccountNumber"
                                        type="text"
                                        class="form-input"
                                        data-field="achAccountNumber"
                                        value={paymentForm.achAccountNumber}
                                        oninput={handlePaymentInput}
                                        placeholder="Up to 17 Digit Account Numbers"
                                        maxlength="17"
                                    />
                                </div>
                                <div class="form-group">
                                    <label for="achAccountNumberConfirm" class="form-label">Confirm Account Number *</label>
                                    <input
                                        id="achAccountNumberConfirm"
                                        type="text"
                                        class="form-input"
                                        data-field="achAccountNumberConfirm"
                                        value={paymentForm.achAccountNumberConfirm}
                                        oninput={handlePaymentInput}
                                        placeholder="Confirm Account Number"
                                        maxlength="17"
                                    />
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="achRoutingNumber" class="form-label">Routing Number *</label>
                                    <input
                                        id="achRoutingNumber"
                                        type="text"
                                        class="form-input"
                                        data-field="achRoutingNumber"
                                        value={paymentForm.achRoutingNumber}
                                        oninput={handlePaymentInput}
                                        placeholder="9 Digit Routing Number"
                                        maxlength="9"
                                    />
                                </div>
                                <div class="form-group">
                                    <label for="achAccountType" class="form-label">Account Type *</label>
                                    <select
                                        id="achAccountType"
                                        class="form-input form-select"
                                        data-field="achAccountType"
                                        onchange={handlePaymentInput}
                                    >
                                        <template for:each={achAccountTypeOptions} for:item="opt">
                                            <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>

                            <div class="ach-checkboxes">
                                <label class="checkbox-label">
                                    <input
                                        type="checkbox"
                                        data-field="saveAch"
                                        checked={paymentForm.saveAch}
                                        onchange={handlePaymentCheckboxChange}
                                    />
                                    <span>Save this ACH for future purchases</span>
                                </label>
                                <label class="checkbox-label checkbox-label-mt">
                                    <input
                                        type="checkbox"
                                        data-field="setDefaultAchPayment"
                                        checked={paymentForm.setDefaultAchPayment}
                                        onchange={handlePaymentCheckboxChange}
                                    />
                                    <span>Set as my default payment method</span>
                                </label>
                            </div>
                        </li>
                    </template>

                    <li class="payment-option-row">
                        <div class="payment-option-header">
                            <label class="radio-label">
                                <input
                                    type="radio"
                                    name="accountPaymentType"
                                    value="cc"
                                    checked={isCreditCard}
                                    onchange={handlePaymentTypeChange}
                                    class="radio-input"
                                />
                                <span>Pay with Credit Card</span>
                            </label>
                            <div class="card-logos" aria-label="Accepted cards">
                                <img src={visaIcon} alt="Visa" title="Visa" class="card-logo-img" />
                                <img src={mastercardIcon} alt="MC" title="Master Card" class="card-logo-img" />
                                <img src={amexIcon} alt="AXP" title="American Express" class="card-logo-img" />
                                <img src={discoverIcon} alt="DGN" title="Discover" class="card-logo-img" />
                            </div>
                        </div>
                    </li>

                    <template if:true={isCreditCard}>
                    <li class="payment-fields">
                        <div class="form-group">
                            <label for="paymentCardNumber" class="form-label">Card Number *</label>
                            <input
                                id="paymentCardNumber"
                                data-field="cardNumber"
                                type="text"
                                class="form-input"
                                value={paymentForm.cardNumber}
                                oninput={handlePaymentInput}
                                autocomplete="cc-number"
                                maxlength="19"
                            />
                        </div>

                        <div class="form-row-cc-details">
                            <div class="form-group form-group-cardholder">
                                <label for="paymentCardholderName" class="form-label">Cardholder Name *</label>
                                <input
                                    id="paymentCardholderName"
                                    data-field="cardHolderName"
                                    type="text"
                                    class="form-input"
                                    value={paymentForm.cardHolderName}
                                    oninput={handlePaymentInput}
                                    autocomplete="cc-name"
                                />
                            </div>
                            <div class="form-group form-group-expiry">
                                <label class="form-label">Expiration Date *</label>
                                <div class="expiry-selects">
                                    <select class="form-input form-select" data-field="expiryMonth" onchange={handlePaymentInput}>
                                        <option value=""></option>
                                        <template for:each={paymentMonthOptions} for:item="opt">
                                            <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                        </template>
                                    </select>
                                    <select class="form-input form-select" data-field="expiryYear" onchange={handlePaymentInput}>
                                        <option value=""></option>
                                        <template for:each={paymentYearOptions} for:item="opt">
                                            <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                        </template>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group form-group-cvv">
                                <label for="paymentCvv" class="form-label">CVV *</label>
                                <input
                                    id="paymentCvv"
                                    data-field="cardCvv"
                                    type="text"
                                    class="form-input"
                                    value={paymentForm.cardCvv}
                                    oninput={handlePaymentInput}
                                    autocomplete="cc-csc"
                                    maxlength="4"
                                />
                            </div>
                        </div>

                        <h3 class="billing-heading">Billing Address</h3>

                        <template if:true={paymentShippingAddressDisplay}>
                            <ul class="billing-radio-list">
                                <li>
                                    <label class="radio-label">
                                        <input type="radio" name="paymentBillingType" value="true"
                                            checked={paymentBillingUseShippingChecked}
                                            onchange={handlePaymentBillingRadioChange}
                                            class="radio-input" />
                                        <span>Use Shipping Address</span>
                                    </label>
                                    <div class="billing-address-preview">{paymentShippingAddressDisplay}</div>
                                </li>
                                <li>
                                    <label class="radio-label">
                                        <input type="radio" name="paymentBillingType" value="false"
                                            checked={paymentBillingUseDifferentChecked}
                                            onchange={handlePaymentBillingRadioChange}
                                            class="radio-input" />
                                        <span>Enter a Different Address</span>
                                    </label>
                                </li>
                            </ul>
                        </template>

                        <template if:true={showPaymentBillingForm}>
                            <div class="billing-form">
                                <div class="form-group">
                                    <label for="paymentBillingStreet" class="form-label">Address *</label>
                                    <input
                                        id="paymentBillingStreet"
                                        data-field="billingStreet"
                                        type="text"
                                        class="form-input"
                                        value={paymentForm.billingStreet}
                                        oninput={handlePaymentInput}
                                        placeholder="Enter your address"
                                    />
                                </div>
                                <div class="form-row-address">
                                    <div class="form-group form-group-city">
                                        <label for="paymentBillingCity" class="form-label">City *</label>
                                        <input
                                            id="paymentBillingCity"
                                            data-field="billingCity"
                                            type="text"
                                            class="form-input"
                                            value={paymentForm.billingCity}
                                            oninput={handlePaymentInput}
                                        />
                                    </div>
                                    <div class="form-group form-group-state">
                                        <label for="paymentBillingState" class="form-label">State *</label>
                                        <select
                                            id="paymentBillingState"
                                            class="form-input form-select"
                                            data-field="billingStateCode"
                                            onchange={handlePaymentInput}
                                        >
                                            <option value=""></option>
                                            <template for:each={paymentBillingStates} for:item="st">
                                                <option key={st.value} value={st.value} selected={st.selected}>{st.label}</option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="form-group form-group-zip">
                                        <label for="paymentBillingZip" class="form-label">ZIP Code *</label>
                                        <input
                                            id="paymentBillingZip"
                                            data-field="billingZip"
                                            type="text"
                                            class="form-input"
                                            value={paymentForm.billingZip}
                                            oninput={handlePaymentInput}
                                            maxlength="10"
                                        />
                                    </div>
                                </div>
                            </div>
                        </template>
                    </li>
                    </template>
                </ul>

                <div class="button-row">
                    <button class="primary-button" type="button" onclick={handleSavePayment} disabled={isPaymentSubmitDisabled}>Save Payment Method</button>
                    <button class="secondary-button" type="button" onclick={handleResetPayment} disabled={isSavingPayment}>Cancel</button>
                </div>
            </section>
        </template>
    </div>

    <!-- Organization Modal -->
    <template if:true={showOrganizationModal}>
        <section class="modal-backdrop" onclick={closeOrganizationModal} role="presentation">
            <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="orgModalTitle" onclick={stopModalPropagation}>
                <button class="modal-close" type="button" aria-label="Close" onclick={closeOrganizationModal} disabled={isSavingOrganization}>&times;</button>
                <h2 id="orgModalTitle" class="modal-title">Organization Details</h2>
                <div class="modal-form-stack">
                    <label class="field">
                        <span>School Name *</span>
                        <input data-field="schoolName" type="text" value={organizationForm.schoolName} oninput={handleOrganizationInput} />
                    </label>
                    <label class="field">
                        <span>School Address</span>
                        <input data-field="schoolAddress" type="text" placeholder="Enter your address" value={organizationForm.schoolAddress} oninput={handleOrganizationInput} />
                    </label>
                    <div class="modal-two-col">
                        <label class="field">
                            <span>City</span>
                            <input data-field="city" type="text" value={organizationForm.city} oninput={handleOrganizationInput} />
                        </label>
                        <label class="field">
                            <span>State</span>
                            <div class="select-wrapper">
                                <select data-field="stateCode" onchange={handleOrganizationInput}>
                                    <template for:each={orgStateOptions} for:item="opt">
                                        <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                    </template>
                                </select>
                            </div>
                        </label>
                    </div>
                    <div class="modal-two-col">
                        <label class="field">
                            <span>ZIP Code</span>
                            <input data-field="postalCode" type="text" value={organizationForm.postalCode} oninput={handleOrganizationInput} />
                        </label>
                        <label class="field">
                            <span>Phone</span>
                            <input data-field="phone" type="tel" value={organizationForm.phone} oninput={handleOrganizationInput} />
                        </label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="primary-button" type="button" onclick={handleSaveOrganization} disabled={isSavingOrganization}>Save</button>
                    <button class="secondary-button" type="button" onclick={closeOrganizationModal} disabled={isSavingOrganization}>Cancel</button>
                </div>
            </div>
        </section>
    </template>

    <!-- Shipping Address Modal -->
    <template if:true={showShippingModal}>
        <section class="modal-backdrop" onclick={closeShippingModal} role="presentation">
            <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="shippingModalTitle" onclick={stopModalPropagation}>
                <button class="modal-close" type="button" aria-label="Close" onclick={closeShippingModal} disabled={isSavingShipping}>&times;</button>
                <h2 id="shippingModalTitle" class="modal-title">Shipping Address</h2>
                <div class="modal-form-stack">
                    <label class="field">
                        <span>Street Address</span>
                        <input data-field="street" type="text" value={shippingForm.street} oninput={handleShippingInput} />
                    </label>
                    <label class="field">
                        <span>City</span>
                        <input data-field="city" type="text" value={shippingForm.city} oninput={handleShippingInput} />
                    </label>
                    <div class="modal-two-col">
                        <label class="field">
                            <span>State</span>
                            <input data-field="stateCode" type="text" maxlength="2" placeholder="e.g. GA" value={shippingForm.stateCode} oninput={handleShippingInput} />
                        </label>
                        <label class="field">
                            <span>ZIP Code</span>
                            <input data-field="postalCode" type="text" value={shippingForm.postalCode} oninput={handleShippingInput} />
                        </label>
                    </div>
                    <label class="field">
                        <span>Country</span>
                        <input data-field="country" type="text" value={shippingForm.country} oninput={handleShippingInput} />
                    </label>
                </div>
                <div class="modal-actions">
                    <button class="primary-button" type="button" onclick={handleSaveShipping} disabled={isSavingShipping}>Save Address</button>
                    <button class="secondary-button" type="button" onclick={closeShippingModal} disabled={isSavingShipping}>Cancel</button>
                </div>
            </div>
        </section>
    </template>

</template>
