<template>
    <section class="account-wishlist-page" aria-labelledby="wishlistHeading">
        <div class="page-header">
            <h1 id="wishlistHeading" class="page-title">{heading}</h1>
            <div class="header-actions">
                <button class="header-button" type="button" onclick={handleShareEmail}>Share wishlist via email</button>
                <button class="header-button" type="button" onclick={handleCopyLink}>{copyLinkLabel}</button>
            </div>
        </div>

        <template if:true={isLoading}>
            <div class="wishlist-state loading-state">
                <lightning-spinner alternative-text="Loading wishlist" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:true={errorMessage}>
                <div class="wishlist-state error-state" role="alert">
                    <p>{errorMessage}</p>
                </div>
            </template>

            <template if:true={showEmptyState}>
                <div class="wishlist-state empty-state">
                    <p class="empty-text">Your wishlist is empty. Click <a href={shopAllUrl}>here</a> to see available products.</p>
                </div>
            </template>

            <template if:true={hasItems}>
                <div class="wishlist-list">
                    <template for:each={items} for:item="item">
                        <article key={item.wishlistItemId} class="wishlist-item-shell">
                            <c-product-detail-component
                                product-id={item.productId}
                                store-name={storeName}
                                web-store-id={webStoreId}
                            ></c-product-detail-component>
                        </article>
                    </template>
                </div>
            </template>
        </template>
    </section>
</template>
