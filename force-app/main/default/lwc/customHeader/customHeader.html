<template>
  <header class="abc-hdr" aria-label="Site header">
    <!-- ═══════════════════════════════════════════════════════════
         DESKTOP / TABLET  (≥768px)
         Single row: Logo | [Top: nav links] [Bottom: state+search+cart]
         ═══════════════════════════════════════════════════════════ -->
    <div class="abc-container">
      <!-- Logo -->
      <a
        href="/AmericanBookCompany/"
        class="abc-logo-link"
        aria-label="American Book Company home"
      >
        <img src={logoUrl} alt="ABC Logo" class="abc-logo" />
      </a>

      <!-- Main column (fills remaining space) -->
      <div class="abc-main">
        <!-- Top sub-row: Nav links (right-aligned) -->
        <div class="abc-nav-area">
          <ul class="abc-nav-list" aria-label="Main navigation">
            <template for:each={navLinks} for:item="link">
              <li key={link.id} class="abc-nav-item">
                <a
                  href={link.url}
                  class="abc-nav-link"
                  target={link.target}
                  rel={link.rel}
                >
                  {link.label}
                </a>
              </li>
            </template>

            <!-- My Account (last item — no right-border separator) -->
            <li class="abc-nav-item abc-nav-item--account">
              <template if:true={isGuest}>
                <a href={loginUrl} class="abc-nav-link abc-nav-link--account"
                  >My Account</a
                >
              </template>
              <template if:false={isGuest}>
                <button
                  class="abc-nav-link abc-nav-link--account"
                  type="button"
                  onclick={toggleAccountMenu}
                  aria-haspopup="true"
                  aria-expanded={accountMenuOpen}
                >
                  My Account
                  <svg
                    class="abc-chev-svg"
                    viewBox="0 0 12 8"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      d="M1 1l5 5 5-5"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      fill="none"
                    />
                  </svg>
                </button>
                <template if:true={accountMenuOpen}>
                  <div
                    class="abc-account-dd"
                    role="menu"
                    aria-label="Account menu"
                  >
                    <a
                      href={accountUrl}
                      class="abc-dd-item"
                      role="menuitem"
                      onclick={closeAccountMenu}
                      >My Account</a
                    >
                    <a
                      href={ordersUrl}
                      class="abc-dd-item"
                      role="menuitem"
                      onclick={closeAccountMenu}
                      >My Orders</a
                    >
                    <a
                      href={wishlistUrl}
                      class="abc-dd-item"
                      role="menuitem"
                      onclick={closeAccountMenu}
                      >My Wishlist</a
                    >
                    <button
                      class="abc-dd-item abc-dd-logout"
                      type="button"
                      role="menuitem"
                      onclick={handleLogout}
                    >
                      Log Out
                    </button>
                  </div>
                </template>
              </template>
            </li>
          </ul>
        </div>

        <!-- Bottom sub-row: State + Search + Cart -->
        <div class="abc-util-row">
          <!-- State filter (native select, full state name) -->
          <div class="abc-state-wrap">
            <select
              class="abc-state-select"
              onchange={handleStateChange}
              aria-label="Select state"
            >
              <template for:each={stateOptions} for:item="opt">
                <option key={opt.name} value={opt.name} selected={opt.selected}>
                  {opt.name}
                </option>
              </template>
            </select>
          </div>

          <!-- Search -->
          <div class="abc-search-wrap">
            <input
              type="text"
              class="abc-search-input"
              placeholder="Search..."
              value={searchTerm}
              oninput={handleSearchInput}
              onkeydown={handleSearchKeyDown}
              aria-label="Search throughout the site."
            />
            <span class="abc-search-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                class="abc-search-svg"
                focusable="false"
                fill="currentColor"
              >
                <path
                  d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                />
              </svg>
            </span>
          </div>

          <!-- Cart -->
          <div class="abc-cart-wrap">
            <a href={cartUrl} class="abc-cart-link" aria-label={cartAriaLabel}>
              <svg
                class="abc-cart-svg"
                viewBox="0 0 576 512"
                aria-hidden="true"
                focusable="false"
                fill="currentColor"
              >
                <path
                  d="M24 0C10.7 0 0 10.7 0 24S10.7 48 24 48H73.5c5.6 0 10.5 3.9 11.8 9.4l64.4 265.4c-24.2 5.6-42.2 27.3-42.2 53.2c0 30.1 24.4 54.5 54.5 54.5H472c13.3 0 24-10.7 24-24s-10.7-24-24-24H161.9c-3.6 0-6.5-2.9-6.5-6.5s2.9-6.5 6.5-6.5H452.1c22.3 0 41.9-14.9 48.2-36.4L548.7 113c6.6-22.5-10.2-45-33.7-45H117.8l-3.7-15.3C108.9 21.7 88.9 0 63.5 0H24zm96 512a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm336-48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0z"
                />
              </svg>
              <template if:true={showCartBadge}>
                <span class="abc-cart-badge" aria-hidden="true"
                  >{cartCount}</span
                >
              </template>
            </a>
          </div>
        </div>
        <!-- /abc-util-row -->
      </div>
      <!-- /abc-main -->
    </div>
    <!-- /abc-container -->

    <!-- ═══════════════════════════════════════════════════════════
         MOBILE  (<768px)
         Top row:    Logo | Cart | Hamburger
         Second row: Search (full width)
         Drawer:     State select + Nav links + Account
         ═══════════════════════════════════════════════════════════ -->
    <div class="abc-mobile-hdr">
      <div class="abc-mob-top">
        <a
          href="/AmericanBookCompany/"
          class="abc-logo-link"
          aria-label="American Book Company home"
        >
          <img src={logoUrl} alt="ABC Logo" class="abc-logo abc-logo--mob" />
        </a>
        <div class="abc-mob-right">
          <a
            href={cartUrl}
            class="abc-cart-link abc-cart-link--mob"
            aria-label={cartAriaLabel}
          >
            <svg
              class="abc-cart-svg"
              viewBox="0 0 576 512"
              aria-hidden="true"
              focusable="false"
              fill="currentColor"
            >
              <path
                d="M24 0C10.7 0 0 10.7 0 24S10.7 48 24 48H73.5c5.6 0 10.5 3.9 11.8 9.4l64.4 265.4c-24.2 5.6-42.2 27.3-42.2 53.2c0 30.1 24.4 54.5 54.5 54.5H472c13.3 0 24-10.7 24-24s-10.7-24-24-24H161.9c-3.6 0-6.5-2.9-6.5-6.5s2.9-6.5 6.5-6.5H452.1c22.3 0 41.9-14.9 48.2-36.4L548.7 113c6.6-22.5-10.2-45-33.7-45H117.8l-3.7-15.3C108.9 21.7 88.9 0 63.5 0H24zm96 512a48 48 0 1 0 0-96 48 48 0 1 0 0 96zm336-48a48 48 0 1 0 -96 0 48 48 0 1 0 96 0z"
              />
            </svg>
            <template if:true={showCartBadge}>
              <span class="abc-cart-badge" aria-hidden="true">{cartCount}</span>
            </template>
          </a>
          <button
            class={hamburgerClass}
            type="button"
            onclick={toggleMobileMenu}
            aria-label={mobileMenuAriaLabel}
            aria-expanded={mobileMenuOpen}
          >
            <span class="abc-bar abc-bar-top"></span>
            <span class="abc-bar abc-bar-mid"></span>
            <span class="abc-bar abc-bar-bot"></span>
          </button>
        </div>
      </div>

      <!-- Mobile search row -->
      <div class="abc-mob-search-row">
        <div class="abc-search-wrap abc-search-wrap--full">
          <input
            type="text"
            class="abc-search-input"
            placeholder="Search..."
            value={searchTerm}
            oninput={handleSearchInput}
            onkeydown={handleSearchKeyDown}
            aria-label="Search throughout the site."
          />
          <span class="abc-search-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              class="abc-search-svg"
              focusable="false"
              fill="currentColor"
            >
              <path
                d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
              />
            </svg>
          </span>
        </div>
      </div>

      <!-- Mobile drawer -->
      <div class={mobileDrawerClass}>
        <div class="abc-mob-state-wrap">
          <select
            class="abc-state-select abc-state-select--full"
            onchange={handleStateChange}
            aria-label="Select state"
          >
            <template for:each={stateOptions} for:item="opt">
              <option key={opt.name} value={opt.name} selected={opt.selected}>
                {opt.name}
              </option>
            </template>
          </select>
        </div>
        <ul class="abc-mob-nav-list">
          <template for:each={navLinks} for:item="link">
            <li key={link.id} class="abc-mob-nav-item">
              <a
                href={link.url}
                class="abc-mob-nav-link"
                target={link.target}
                rel={link.rel}
                onclick={closeMobileMenu}
              >
                {link.label}
              </a>
            </li>
          </template>
          <hr class="abc-mob-divider" />
          <template if:true={isGuest}>
            <li class="abc-mob-nav-item">
              <a
                href={loginUrl}
                class="abc-mob-nav-link"
                onclick={closeMobileMenu}
                >Log In</a
              >
            </li>
          </template>
          <template if:false={isGuest}>
            <li class="abc-mob-nav-item">
              <a
                href={accountUrl}
                class="abc-mob-nav-link"
                onclick={closeMobileMenu}
                >My Account</a
              >
            </li>
            <li class="abc-mob-nav-item">
              <a
                href={ordersUrl}
                class="abc-mob-nav-link"
                onclick={closeMobileMenu}
                >My Orders</a
              >
            </li>
            <li class="abc-mob-nav-item">
              <a
                href={wishlistUrl}
                class="abc-mob-nav-link"
                onclick={closeMobileMenu}
                >My Wishlist</a
              >
            </li>
            <li class="abc-mob-nav-item">
              <button
                class="abc-mob-nav-link abc-mob-logout"
                type="button"
                onclick={handleLogout}
              >
                Log Out
              </button>
            </li>
          </template>
        </ul>
      </div>
    </div>
    <!-- /abc-mobile-hdr -->
  </header>
</template>
