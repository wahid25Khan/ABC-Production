<template>
  <header class="abc-hdr" aria-label="Site header">
    <!-- Desktop / Tablet -->
    <div class="abc-container">
      <a
        href={homePageUrl}
        class="abc-logo-link"
        aria-label="American Book Company home"
      >
        <img src={logoUrl} alt="ABC Logo" class="abc-logo" />
      </a>

      <div class="abc-main">
        <div class="abc-nav-area">
          <ul class="abc-nav-list" aria-label="Main navigation">
            <template for:each={navLinks} for:item="link">
              <li key={link.id} data-nav={link.id} class="abc-nav-item">
                <a
                  href={link.url}
                  class="abc-nav-link"
                  target={link.target}
                  rel={link.rel}
                >
                  {link.label}
                </a>
              </li>
            </template>

            <li class="abc-nav-item abc-nav-item--account">
              <button
                class="abc-nav-link abc-nav-link--account"
                type="button"
                onclick={toggleAccountMenu}
                aria-haspopup="true"
                aria-expanded={accountMenuOpen}
              >
                MY ACCOUNT
                <svg
                  class="abc-chev-svg"
                  viewBox="0 0 12 8"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M1 1l5 5 5-5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    fill="none"
                  />
                </svg>
              </button>

              <template if:true={accountMenuOpen}>
                <div
                  class="abc-account-dd"
                  role="menu"
                  aria-label="Account menu"
                >
                  <template if:true={isGuest}>
                    <a
                      href={loginUrl}
                      class="abc-dd-item"
                      role="menuitem"
                      onclick={closeAccountMenu}
                      >LOGIN</a
                    >
                    <a
                      href={createAccountUrl}
                      class="abc-dd-item"
                      role="menuitem"
                      onclick={closeAccountMenu}
                    >
                      CREATE ACCOUNT
                    </a>
                  </template>

                  <template if:false={isGuest}>
                    <a
                      href={accountUrl}
                      class="abc-dd-item"
                      role="menuitem"
                      onclick={closeAccountMenu}
                      >ACCOUNT DETAILS</a
                    >
                    <a
                      href={ordersUrl}
                      class="abc-dd-item"
                      role="menuitem"
                      onclick={closeAccountMenu}
                      >MY ORDERS</a
                    >
                    <a
                      href={wishlistUrl}
                      class="abc-dd-item"
                      role="menuitem"
                      onclick={closeAccountMenu}
                      >MY WISHLIST</a
                    >
                    <a
                      href={submitPurchaseOrderUrl}
                      class="abc-dd-item"
                      role="menuitem"
                      onclick={closeAccountMenu}
                      >SUBMIT A PO</a
                    >
                    <button
                      class="abc-dd-item abc-dd-logout"
                      type="button"
                      role="menuitem"
                      onclick={handleLogout}
                    >
                      LOG OUT
                    </button>
                  </template>
                </div>
              </template>
            </li>
          </ul>
        </div>

        <div class="abc-util-row">
          <div class="abc-state-wrap">
            <select
              class="abc-state-select"
              onchange={handleStateChange}
              aria-label="Select state"
            >
              <template for:each={stateOptions} for:item="opt">
                <option key={opt.name} value={opt.name} selected={opt.selected}>
                  {opt.name}
                </option>
              </template>
            </select>
          </div>

          <div class="abc-search-wrap">
            <input
              type="text"
              class="abc-search-input"
              placeholder="Search..."
              value={searchTerm}
              oninput={handleSearchInput}
              onkeydown={handleSearchKeyDown}
              aria-label="Search throughout the site."
            />
            <span class="abc-search-icon" aria-hidden="true" onclick={doTheSearch}>
              <svg
                viewBox="0 0 24 24"
                class="abc-search-svg"
                focusable="false"
                fill="currentColor"
              >
                <path
                  d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                />
              </svg>
            </span>
          </div>

          <div class="abc-cart-wrap">
            <a href={cartUrl} class="abc-cart-link" aria-label={cartAriaLabel}>
              <img src={cartShoppingLight} class="abc-cart-svg" alt="Cart" />
              <template if:true={showCartBadge}>
                <span class="abc-cart-badge" aria-hidden="true"
                  >{cartCount}</span
                >
              </template>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile -->
    <div class="abc-mobile-hdr">
      <div class="abc-mob-top">
        <div class="abc-mob-col">
          <button
            class={hamburgerClass}
            type="button"
            onclick={toggleMobileMenu}
            aria-label={mobileMenuAriaLabel}
          >
            <template if:false={mobileMenuOpen}>
              <img src={barslight} class="abc-icon-svg" alt="Menu" />
            </template>
            <template if:true={mobileMenuOpen}>
              <img src={rectangleXmarkLight} class="abc-icon-svg" alt="Close" />
            </template>
          </button>
        </div>

        <div class="abc-mob-col abc-mob-state">
          <img src={locationDotLight} class="abc-icon-svg--small" alt="State" />
          <hr class="abc-mob-hr" />
          <div class="abc-mob-state-text">{stateAbbreviation}</div>
          <select
            class="abc-mob-state-select-overlay"
            onchange={handleStateChange}
            aria-label="Select state"
          >
            <template for:each={stateOptions} for:item="opt">
              <option key={opt.name} value={opt.name} selected={opt.selected}>
                {opt.name}
              </option>
            </template>
          </select>
        </div>

        <div class="abc-mob-col abc-mob-logo-center">
          <a href="/AmericanBookCompany/">
            <img src={logoUrl} alt="ABC Logo" class="abc-logo-mob-center" />
          </a>
        </div>

        <div class="abc-mob-col">
          <template if:true={isGuest}>
            <a href={loginUrl} class="abc-mob-account-link" aria-label="Login">
              <img src={userLight} class="abc-icon-svg" alt="User" />
            </a>
          </template>

          <template if:false={isGuest}>
            <button
              type="button"
              class={mobileAccountButtonClass}
              onclick={toggleMobileAccountMenu}
              aria-label="My account"
              aria-expanded={mobileAccountMenuOpen}
            >
              <img src={userLight} class="abc-icon-svg" alt="User" />
            </button>
          </template>
        </div>

        <div class="abc-mob-col abc-mob-cart">
          <a
            href={cartUrl}
            class="abc-mob-cart-link"
            aria-label={cartAriaLabel}
          >
            <img src={cartShoppingLight} class="abc-icon-svg" alt="Cart" />
            <template if:true={showCartBadge}>
              <span class="abc-cart-badge-mob">{cartCount}</span>
            </template>
          </a>
        </div>
      </div>

      <template if:false={mobileMenuOpen}>
        <div class="abc-mob-search-row">
          <div class="abc-search-wrap abc-search-wrap--full">
            <input
              type="text"
              class="abc-search-input"
              placeholder="Search..."
              value={searchTerm}
              oninput={handleSearchInput}
              onkeydown={handleSearchKeyDown}
              aria-label="Search throughout the site."
            />
            <span class="abc-search-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                class="abc-search-svg"
                focusable="false"
                fill="currentColor"
              >
                <path
                  d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                />
              </svg>
            </span>
          </div>
        </div>
      </template>

      <!-- Mobile nav drawer -->
      <div class={mobileDrawerClass}>
        <ul class="abc-mob-nav-list">
          <template for:each={navLinks} for:item="link">
            <li key={link.id} class="abc-mob-nav-item">
              <a
                href={link.url}
                class="abc-mob-nav-link"
                target={link.target}
                rel={link.rel}
                onclick={closeMobileMenu}
              >
                <span>{link.mobileLabel}</span>
                <svg
                  class="abc-chevron-right"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </a>
            </li>
          </template>
        </ul>
      </div>

      <!-- Mobile account drawer -->
      <template if:false={isGuest}>
        <div class={mobileAccountDrawerClass}>
          <ul class="abc-mob-nav-list">
            <li class="abc-mob-nav-item">
              <a
                href={accountUrl}
                class="abc-mob-nav-link"
                onclick={closeMobileAccountMenu}
                >Account Details</a
              >
            </li>
            <li class="abc-mob-nav-item">
              <a
                href={ordersUrl}
                class="abc-mob-nav-link"
                onclick={closeMobileAccountMenu}
                >My Orders</a
              >
            </li>
            <!-- <li class="abc-mob-nav-item" data-nav="wishlist">
              <a href={wishlistUrl} class="abc-mob-nav-link" onclick={closeMobileAccountMenu}>My Wishlist</a>
            </li> -->
            <li class="abc-mob-nav-item">
              <a
                href={submitPurchaseOrderUrl}
                class="abc-mob-nav-link"
                onclick={closeMobileAccountMenu}
                >Submit a PO</a
              >
            </li>
            <li class="abc-mob-nav-item">
              <button
                class="abc-mob-nav-link abc-mob-logout"
                type="button"
                onclick={handleLogout}
              >
                Log Out
              </button>
            </li>
          </ul>
        </div>
      </template>
    </div>
  </header>
</template>
