<template>
  <section class="results-shell">
    <template if:true={loading}>
      <div class="loading-overlay" aria-live="polite" aria-busy="true">
        <div class="loading-panel">
          <lightning-spinner
            alternative-text="Loading products"
            size="medium"
          ></lightning-spinner>
        </div>
      </div>
    </template>

    <div class="hero-block">
      <h1 class="page-title">Shop All</h1>
      <div class="page-subtitle">
        Need to download a quote? Add items to your cart to begin.
      </div>
    </div>

    <div class="top-controls">
      <div class="left-controls">
        <div class="left-controls-top">
          <div class="search-box">
            <input
              type="search"
              placeholder="Search..."
              value={searchText}
              onkeydown={handleSearchKeydown}
              oninput={handleSearchInput}
              onchange={handleSearchInput}
            />
            <span class="search-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
              </svg>
            </span>
          </div>

          <p class="results-summary">{resultsSummary}</p>
        </div>

        <div class="state-dropdown-wrap">
          <div class="custom-select" data-dropdown="state">
            <button
              type="button"
              class="custom-select-trigger"
              onclick={toggleStateDropdown}
              aria-haspopup="listbox"
              aria-expanded={isStateDropdownOpen}
            >
              <span class={stateDisplayClass}>{selectedStateLabel}</span>
              <span class={stateChevronClass}></span>
            </button>

            <template if:true={isStateDropdownOpen}>
              <div class="custom-select-menu" role="listbox">
                <div
                  class={allStatesOptionClass}
                  data-value=""
                  onclick={handleStateOptionClick}
                  role="option"
                >
                  All States
                </div>

                <template for:each={stateOptionsForUi} for:item="opt">
                  <div
                    key={opt.value}
                    class={opt.className}
                    data-value={opt.value}
                    onclick={handleStateOptionClick}
                    role="option"
                  >
                    {opt.label}
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>

      <div class="right-controls">
        <div class="custom-select custom-select-sm" data-dropdown="sort">
          <button
            type="button"
            class="custom-select-trigger"
            onclick={toggleSortDropdown}
            aria-haspopup="listbox"
            aria-expanded={isSortDropdownOpen}
          >
            <span>Sort</span>
            <span class={sortChevronClass}></span>
          </button>

          <template if:true={isSortDropdownOpen}>
            <div
              class="custom-select-menu custom-select-menu-sm"
              role="listbox"
            >
              <template for:each={sortOptionsForUi} for:item="opt">
                <div
                  key={opt.value}
                  class={opt.className}
                  data-value={opt.value}
                  onclick={handleSortOptionClick}
                  role="option"
                >
                  {opt.label}
                </div>
              </template>
            </div>
          </template>
        </div>

        <div class="custom-select custom-select-sm" data-dropdown="pageSize">
          <button
            type="button"
            class="custom-select-trigger"
            onclick={togglePageSizeDropdown}
            aria-haspopup="listbox"
            aria-expanded={isPageSizeDropdownOpen}
          >
            <span>{selectedPageSizeLabel}</span>
            <span class={pageSizeChevronClass}></span>
          </button>

          <template if:true={isPageSizeDropdownOpen}>
            <div
              class="custom-select-menu custom-select-menu-sm"
              role="listbox"
            >
              <template for:each={pageSizeOptionsForUi} for:item="opt">
                <div
                  key={opt.value}
                  class={opt.className}
                  data-value={opt.value}
                  onclick={handlePageSizeOptionClick}
                  role="option"
                >
                  {opt.label}
                </div>
              </template>
            </div>
          </template>
        </div>

        <fieldset class="view-toggle">
          <legend class="slds-assistive-text">View mode</legend>

          <button
            type="button"
            class="view-btn"
            data-mode="grid"
            aria-pressed={ariaGridPressed}
            onclick={handleViewMode}
            title="Grid view"
          >
            ⊞
          </button>

          <button
            type="button"
            class="view-btn"
            data-mode="list"
            aria-pressed={ariaListPressed}
            onclick={handleViewMode}
            title="List view"
          >
            ☰
          </button>
        </fieldset>
      </div>
    </div>

    <div class="results-layout">
      <aside class="filters-column">
        <template for:each={filterGroups} for:item="group">
          <section key={group.key} class="filter-group">
            <template if:true={group.expanded}>
              <button
                type="button"
                class="filter-header"
                data-field={group.key}
                onclick={handleToggleGroup}
                aria-expanded="true"
              >
                <span>{group.label}</span>
                <span class="toggle-symbol">{group.toggleSymbol}</span>
              </button>
            </template>

            <template if:false={group.expanded}>
              <button
                type="button"
                class="filter-header"
                data-field={group.key}
                onclick={handleToggleGroup}
                aria-expanded="false"
              >
                <span>{group.label}</span>
                <span class="toggle-symbol">{group.toggleSymbol}</span>
              </button>
            </template>

            <div if:false={group.collapsed} class="filter-options">
              <template if:true={group.showEmpty}>
                <p class="filter-empty">No values</p>
              </template>

              <template for:each={group.options} for:item="option">
                <label key={option.key} class="filter-option-row">
                  <input
                    type="checkbox"
                    checked={option.checked}
                    data-field={group.key}
                    data-value={option.value}
                    onchange={handleFilterChange}
                  />
                  <span class="option-label">{option.label}</span>
                  <span class="option-count">({option.count})</span>
                </label>
              </template>
            </div>
          </section>
        </template>
      </aside>

      <div class="products-column">
        <template if:true={hasResults}>
          <div class={productsClass}>
            <template for:each={visibleProducts} for:item="product">
              <article key={product.id} class={product.cardClass}>
                <div class="product-image-wrap">
                  <a href={product.productUrl} class="image-link">
                    <template if:true={product.imageUrl}>
                      <img
                        class="product-image"
                        src={product.imageUrl}
                        alt={product.name}
                        loading="lazy"
                      />
                    </template>
                    <template if:false={product.imageUrl}>
                      <div class="img-placeholder">No image</div>
                    </template>
                  </a>

                  <div class="card-overlay" aria-hidden="true">
                    <button
                      class="overlay-btn overlay-btn--look"
                      type="button"
                      disabled
                      tabindex="-1"
                    >
                      Look Inside
                    </button>
                    <button
                      class="overlay-btn overlay-btn--shop"
                      type="button"
                      data-pid={product.id}
                      onclick={handleQuickShop}
                      tabindex="-1"
                    >
                      Quick Shop
                    </button>
                  </div>
                </div>

                <div class="product-meta">
                  <a href={product.productUrl} class="product-name"
                    >{product.name}</a
                  >
                  <p class="starting-label">Starting at</p>
                  <p class="price-label">{product.priceLabel}</p>
                </div>
              </article>
            </template>
          </div>

          <div if:true={showPagination} class="pagination-row">
            <button
              type="button"
              class="page-btn"
              onclick={handlePrevPage}
              disabled={disablePrev}
            >
              ‹
            </button>
            <span class="page-text">Page {currentPage} of {totalPages}</span>
            <button
              type="button"
              class="page-btn"
              onclick={handleNextPage}
              disabled={disableNext}
            >
              ›
            </button>
          </div>
        </template>

        <template if:true={showEmptyState}>
          <p class="empty-results">
            No products found for the selected filters.
          </p>
        </template>
      </div>
    </div>

    <template if:true={isModalOpen}>
      <c-quick-shop-modal
        title={modalTitle}
        isbn={modalIsbn}
        book-image-url={modalImageUrl}
        variation-pricing={modalVariationPricing}
        currency-iso-code={modalCurrencyIsoCode}
        minimum-quantity={modalMinimumQuantity}
        maximum-quantity={modalMaximumQuantity}
        increment-quantity={modalIncrementQuantity}
        onaddtocart={handleAddToCart}
        onviewdetails={handleViewDetails}
        onclose={handleModalClose}
      >
      </c-quick-shop-modal>
    </template>
  </section>
</template>
