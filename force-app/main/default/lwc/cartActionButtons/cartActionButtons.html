<template>
    <div class="actions-panel">
        <button class="btn-outline" onclick={handleDownloadQuote} disabled={isDownloading}>
            <template lwc:if={isDownloading}>
                <lightning-spinner alternative-text="Generating quote" size="small"></lightning-spinner>
            </template>
            <template lwc:else>
                Download a Quote
            </template>
        </button>

        <button class="btn-primary" onclick={handleProceedToCheckout}>
            Proceed to Checkout
        </button>

        <button class="po-link" onclick={handleSubmitPO}>
            Need to submit a PO?
        </button>

        <template lwc:if={showInlineErrorBanner}>
            <div class="error-banner" role="alert">{errorMessage}</div>
        </template>
        <template lwc:if={downloadSuccess}>
            <output class="success-banner">Quote downloaded successfully.</output>
        </template>
    </div>

    <template lwc:if={showQuoteModal}>
        <section class="quote-modal-backdrop" onclick={closeQuoteModal}>
            <div
                class="quote-modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="quoteModalTitle"
                onclick={stopModalPropagation}
            >
                <button
                    type="button"
                    class="modal-close"
                    aria-label="Close dialog"
                    onclick={closeQuoteModal}
                    disabled={isDownloading}
                >
                    &times;
                </button>

                <h2 id="quoteModalTitle" class="modal-title">Download a Quote</h2>
                <h3 class="modal-section-heading">Shipping Address:</h3>

                <div class="modal-form-stack">
                    <label class="modal-field">
                        <span class="field-label">Contact Name *</span>
                        <input
                            class="quote-field"
                            data-field="contactName"
                            type="text"
                            name="contactName"
                            value={quoteForm.contactName}
                            oninput={handleQuoteFieldChange}
                        />
                    </label>

                    <label class="modal-field">
                        <span class="field-label">Organization *</span>
                        <input
                            class="quote-field"
                            data-field="organization"
                            type="text"
                            name="organization"
                            value={quoteForm.organization}
                            oninput={handleQuoteFieldChange}
                        />
                    </label>

                    <label class="modal-field">
                        <span class="field-label">Address *</span>
                        <input
                            class="quote-field"
                            data-field="address"
                            type="text"
                            name="address"
                            value={quoteForm.address}
                            oninput={handleQuoteFieldChange}
                        />
                    </label>

                    <div class="modal-row">
                        <label class="modal-field modal-field-city">
                            <span class="field-label">City *</span>
                            <input
                                class="quote-field"
                                data-field="city"
                                type="text"
                                name="city"
                                value={quoteForm.city}
                                oninput={handleQuoteFieldChange}
                            />
                        </label>

                        <label class="modal-field modal-field-state">
                            <span class="field-label">State *</span>
                            <select
                                class="quote-field quote-select"
                                data-field="stateCode"
                                name="stateCode"
                                onchange={handleQuoteFieldChange}
                            >
                                <option value=""></option>
                                <template for:each={usStates} for:item="st">
                                    <option key={st.value} value={st.value} selected={st.selected}>{st.label}</option>
                                </template>
                            </select>
                        </label>
                    </div>

                    <label class="modal-field modal-field-zip">
                        <span class="field-label">ZIP Code *</span>
                        <input
                            class="quote-field"
                            data-field="postalCode"
                            type="text"
                            name="postalCode"
                            maxlength="10"
                            value={quoteForm.postalCode}
                            oninput={handleQuoteFieldChange}
                        />
                    </label>

                    <div class="modal-row">
                        <label class="modal-field">
                            <span class="field-label">Phone *</span>
                            <input
                                class="quote-field"
                                data-field="phone"
                                type="tel"
                                name="phone"
                                value={quoteForm.phone}
                                oninput={handleQuoteFieldChange}
                            />
                        </label>

                        <label class="modal-field">
                            <span class="field-label">Email *</span>
                            <input
                                class="quote-field"
                                data-field="email"
                                type="email"
                                name="email"
                                value={quoteForm.email}
                                oninput={handleQuoteFieldChange}
                            />
                        </label>
                    </div>

                    <label class="modal-checkbox-label">
                        <input
                            type="checkbox"
                            data-field="taxExempt"
                            name="taxExempt"
                            checked={quoteForm.taxExempt}
                            onchange={handleQuoteFieldChange}
                        />
                        <span>Tax Exempt</span>
                    </label>
                </div>

                <template lwc:if={errorMessage}>
                    <div class="error-banner modal-error" role="alert">{errorMessage}</div>
                </template>

                <div class="modal-actions">
                    <button
                        type="button"
                        class="modal-download-btn"
                        onclick={handleQuoteDownloadConfirm}
                        disabled={isDownloading}
                    >
                        <template lwc:if={isDownloading}>Downloading...</template>
                        <template lwc:else>Download</template>
                    </button>

                    <button
                        type="button"
                        class="modal-cancel-btn"
                        onclick={closeQuoteModal}
                        disabled={isDownloading}
                    >
                        Cancel
                    </button>
                </div>
            </div>
        </section>
    </template>
</template>
