<template>
    <div class="checkout-shell">

        <!-- Page heading -->
        <h1 class="page-heading">Checkout</h1>

        <template if:true={hasItems}>
            <div class="checkout-layout">

                <!-- Left column: all steps -->
                <div class="steps-column">

                    <!-- STEP 1 — Contact Information -->
                    <div class="step-section">
                        <div class="step-header">
                            <h2 class="step-heading">1. Enter Contact Information</h2>
                            <div class="step-header-right">
                                <template if:true={showStep1SignIn}>
                                    <a href={signInUrl} class="header-link">
                                        <span class="header-link-full">Already Have an Account? Sign In.</span>
                                        <span class="header-link-short">Sign In</span>
                                    </a>
                                </template>
                                <template if:true={showStep1Edit}>
                                    <span class="edit-link" onclick={editStep1} role="button" tabindex="0">Edit</span>
                                </template>
                            </div>
                        </div>

                        <template if:true={isStep1}>
                            <form class="step-form" onsubmit={handleStep1Submit}>
                                <div class="form-group">
                                    <label for="contactName" class="form-label">Name *</label>
                                    <input id="contactName" type="text" class="form-input"
                                        data-field="contactName" value={form.contactName}
                                        oninput={handleInput} autocomplete="name" required />
                                </div>

                                <div class="form-group">
                                    <label for="contactEmail" class="form-label">Email *</label>
                                    <input id="contactEmail" type="email" class="form-input"
                                        data-field="contactEmail" value={form.contactEmail}
                                        oninput={handleInput} autocomplete="email" required />
                                </div>

                                <template if:true={contactEmailError}>
                                    <div class="field-error">{contactEmailError}</div>
                                </template>

                                <div class="form-group">
                                    <label for="contactEmailConfirm" class="form-label">Confirm Email *</label>
                                    <input id="contactEmailConfirm" type="email" class="form-input"
                                        data-field="contactEmailConfirm" value={form.contactEmailConfirm}
                                        oninput={handleInput} required />
                                </div>

                                <div class="form-group">
                                    <label for="contactPhone" class="form-label form-label-phone">
                                        <span>Phone Number *</span>
                                        <span class="phone-hint">Phone numbers will only be used to assist in delivering your orders</span>
                                    </label>
                                    <input id="contactPhone" type="tel" class="form-input"
                                        data-field="contactPhone" value={form.contactPhone}
                                        oninput={handleInput} autocomplete="tel" required />
                                </div>

                                <button type="submit" class="btn-primary btn-continue">Save and Continue</button>
                            </form>
                        </template>

                        <template if:true={showStep1Summary}>
                            <div class="step-summary">
                                <div>{form.contactName}</div>
                                <div>{form.contactEmail}</div>
                                <div>{form.contactPhone}</div>
                            </div>
                        </template>
                    </div>

                    <hr class="step-divider" />

                    <!-- STEP 2 — Shipping Address -->
                    <div class="step-section">
                        <div class="step-header">
                            <h2 class="step-heading">2. Enter Shipping Address</h2>
                            <div class="step-header-right">
                                <template if:true={showStep2Edit}>
                                    <span class="edit-link" onclick={editStep2} role="button" tabindex="0">Edit</span>
                                </template>
                            </div>
                        </div>

                        <template if:true={isStep2}>
                            <form class="step-form" onsubmit={handleStep2Submit}>
                                <div class="form-group">
                                    <label for="shipName" class="form-label">Ship To *</label>
                                    <input id="shipName" type="text" class="form-input"
                                        data-field="shipName" value={form.shipName}
                                        oninput={handleInput} autocomplete="name" required />
                                </div>

                                <div class="form-group">
                                    <label for="orgName" class="form-label">Organization Name *</label>
                                    <input id="orgName" type="text" class="form-input"
                                        data-field="orgName" value={form.orgName}
                                        oninput={handleInput} autocomplete="organization" required />
                                </div>

                                <div class="form-group">
                                    <label for="street" class="form-label">Street *</label>
                                    <input id="street" type="text" class="form-input"
                                        data-field="street" value={form.street}
                                        oninput={handleInput} autocomplete="address-line1"
                                        placeholder="Enter your address" required />
                                </div>

                                <div class="form-row form-row-address">
                                    <div class="form-group form-group-city">
                                        <label for="city" class="form-label">City *</label>
                                        <input id="city" type="text" class="form-input"
                                            data-field="city" value={form.city}
                                            oninput={handleInput} autocomplete="address-level2" required />
                                    </div>

                                    <div class="form-group form-group-state">
                                        <label for="stateCode" class="form-label">State *</label>
                                        <select id="stateCode" class="form-input form-select"
                                            data-field="stateCode"
                                            onchange={handleStateChange} required>
                                            <option value=""></option>
                                            <template for:each={usStates} for:item="st">
                                                <option key={st.value} value={st.value} selected={st.selected}>{st.label}</option>
                                            </template>
                                        </select>
                                    </div>

                                    <div class="form-group form-group-zip">
                                        <label for="postalCode" class="form-label">ZIP Code *</label>
                                        <input id="postalCode" type="text" class="form-input"
                                            data-field="postalCode" value={form.postalCode}
                                            oninput={handleInput} onchange={handleZipChange}
                                            autocomplete="postal-code" maxlength="10" required />
                                    </div>
                                </div>

                                <template if:true={isGuest}>
                                    <div class="form-group create-account-option">
                                        <label class="checkbox-label">
                                            <input type="checkbox" checked={form.useToCreateAccount}
                                                onchange={handleCreateAccountToggle} />
                                            <span>Use the entered details to create an account</span>
                                        </label>
                                    </div>
                                </template>

                                <button type="submit" class="btn-primary btn-continue" disabled={isLoadingShipping}>
                                    <template if:true={isLoadingShipping}>
                                        <lightning-spinner alternative-text="Loading" size="small" variant="inverse"></lightning-spinner>
                                    </template>
                                    <template if:false={isLoadingShipping}>
                                        Save and Continue
                                    </template>
                                </button>
                            </form>
                        </template>

                        <template if:true={showStep2Summary}>
                            <div class="step-summary">
                                <div>{form.shipName}</div>
                                <div>{form.orgName}</div>
                                <div>{form.street}</div>
                                <div>{cityStateZip}</div>
                            </div>
                        </template>
                    </div>

                    <hr class="step-divider" />

                    <!-- STEP 3 — Payment Method -->
                    <div class="step-section">
                        <div class="step-header">
                            <h2 class="step-heading step-heading-payment">3. Select Payment Method</h2>
                            <div class="step-header-right">
                                <template if:true={showStep3Edit}>
                                    <span class="edit-link" onclick={editStep3} role="button" tabindex="0">Edit</span>
                                </template>
                            </div>
                        </div>

                        <template if:true={isStep3}>
                            <form class="step-form" onsubmit={handlePlaceOrder}>
                                <ul class="payment-list">
                                    <!-- Credit Card / ACH via Authorize.Net Accept Hosted -->
                                    <li class="payment-option-row">
                                        <div class="payment-option-header">
                                            <label class="radio-label">
                                                <input type="radio" name="paymentType" value="cc"
                                                    checked={isCreditCard}
                                                    onchange={handlePaymentTypeChange}
                                                    class="radio-input" />
                                                <span>Pay with Credit Card or ACH</span>
                                            </label>
                                            <div class="card-logos">
                                                <img src={visaIcon} alt="Visa" title="Visa" class="card-logo-img" />
                                                <img src={mastercardIcon} alt="MC" title="Master Card" class="card-logo-img" />
                                                <img src={amexIcon} alt="AXP" title="American Express" class="card-logo-img" />
                                                <img src={discoverIcon} alt="DGN" title="Discover" class="card-logo-img" />
                                            </div>
                                        </div>
                                    </li>

                                    <template if:true={isCreditCard}>
                                        <li class="payment-fields">
                                            <p class="authorize-net-notice">
                                                You will be redirected to Authorize.Net&apos;s secure hosted payment
                                                page to enter your card or ACH details. Your payment information
                                                is never stored on our servers.
                                            </p>
                                        </li>
                                    </template>

                                    <!-- Purchase Order option -->
                                    <li class="payment-option-row">
                                        <label class="radio-label">
                                            <input type="radio" name="paymentType" value="po"
                                                checked={isPurchaseOrder}
                                                onchange={handlePaymentTypeChange}
                                                class="radio-input" />
                                            <span>Pay with Purchase Order</span>
                                        </label>
                                    </li>
                                </ul>

                                <template if:true={stepError}>
                                    <div class="error-banner" role="alert">{stepError}</div>
                                </template>

                                <template if:true={showPlaceOrderInline}>
                                    <div class="place-order-inline">
                                        <button type="submit" class="btn-primary btn-place-order" disabled={isPlacingOrder}>
                                            <template if:true={isPlacingOrder}>
                                                <lightning-spinner alternative-text="Processing" size="small" variant="inverse"></lightning-spinner>
                                            </template>
                                            <template if:false={isPlacingOrder}>
                                                <template if:true={isCreditCard}>Proceed to Secure Checkout</template>
                                                <template if:true={isPurchaseOrder}>Submit Purchase Order</template>
                                                <template if:false={isAnyPaymentTypeSelected}>Place Order</template>
                                            </template>
                                        </button>
                                        <div class="place-order-total">Total: {totalLabel}</div>
                                    </div>
                                </template>
                            </form>
                        </template>

                        <template if:true={showStep3Summary}>
                            <div class="step-summary">
                                <template if:true={isCreditCard}>
                                    <div>Credit Card / ACH (Authorize.Net)</div>
                                </template>
                                <template if:true={isPurchaseOrder}>
                                    <div>Purchase Order</div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Right column: Order Summary + Items -->
                <div class="summary-column">
                    <div class="order-summary-box">
                        <h2 class="summary-title hidden-mobile">Order Summary</h2>
                        <hr class="summary-title-hr hidden-mobile" />

                        <template if:true={summaryLoading}>
                            <div class="summary-loading">
                                <lightning-spinner alternative-text="Loading summary" size="small"></lightning-spinner>
                            </div>
                        </template>

                        <template if:false={summaryLoading}>
                            <table class="summary-table">
                                <tbody>
                                    <tr>
                                        <td>Subtotal</td>
                                        <td class="text-right">{subtotalLabel}</td>
                                    </tr>
                                    <tr>
                                        <td>Shipping</td>
                                        <td class="text-right">{shippingLabel}</td>
                                    </tr>
                                    <tr>
                                        <td>Sales Tax</td>
                                        <td class="text-right">{taxLabel}</td>
                                    </tr>
                                    <tr>
                                        <td colspan="2"><hr class="summary-total-hr hidden-mobile" /></td>
                                    </tr>
                                    <tr class="summary-total-row">
                                        <td>Total</td>
                                        <td class="text-right">{totalLabel}</td>
                                    </tr>
                                </tbody>
                            </table>

                            <div class="shipping-help">
                                <span class="shipping-help-link" onclick={toggleShippingHelp} role="button" tabindex="0">
                                    How are shipping rates calculated?
                                </span>
                            </div>

                        </template>
                    </div>

                    <div class="items-in-order-box">
                        <h2 class="items-title">Items in order ({itemCount})</h2>
                        <template for:each={summaryItems} for:item="item">
                            <div key={item.id} class="order-item">
                                <div class="order-item-image-wrap">
                                    <template if:true={item.imageUrl}>
                                        <img src={item.imageUrl} alt={item.name} class="order-item-image" loading="lazy" />
                                    </template>
                                    <template if:false={item.imageUrl}>
                                        <div class="order-item-image placeholder"></div>
                                    </template>
                                </div>
                                <div class="order-item-details">
                                    <h3 class="order-item-title">{item.name}</h3>
                                    <div class="order-item-meta">
                                        <template if:true={item.hasDigital}>
                                            <div class="order-item-line">{item.quantity} Digital Workbooks</div>
                                        </template>
                                        <template if:true={item.hasColorPrint}>
                                            <div class="order-item-line">{item.quantity} Color Print Workbooks</div>
                                        </template>
                                        <template if:true={item.hasBwPrint}>
                                            <div class="order-item-line">{item.quantity} B&amp;W Print Workbooks</div>
                                        </template>
                                        <div class="order-item-line">{item.quantity} CourseWave Codes for Online Testing</div>
                                    </div>
                                    <div class="order-item-price">{item.totalLabel}</div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </template>

        <template if:false={hasItems}>
            <div class="empty-cart-message">
                <p>Your cart is empty.</p>
                <a href={cartUrl} class="btn-primary btn-return-cart">Return to Cart</a>
            </div>
        </template>

        <!-- Shipping help modal -->
        <template if:true={showShippingModal}>
            <div class="modal-overlay" onclick={closeShippingModal}>
                <div class="shipping-modal-card" onclick={stopPropagation}>
                    <button type="button" class="shipping-modal-close" onclick={closeShippingModal} aria-label="Close">
                        &times;
                    </button>
                    <h3 class="shipping-modal-title">How are shipping costs calculated?</h3>
                    <p class="shipping-modal-text">
                        Books are heavy&#x2013;but shipping costs don&#x27;t have to be. ABC uses a flat-rate shipping system based on the uniform size of our boxes. We calculate that rate as a percentage of your order so you&#x27;re not paying for empty space.
                    </p>
                </div>
            </div>
        </template>

        <!-- Place order error modal -->
        <template if:true={showErrorModal}>
            <div class="modal-overlay" onclick={closeErrorModal}>
                <div class="modal-content" onclick={stopPropagation}>
                    <div class="error-modal-body">
                        <div class="error-modal-title">Failed to process order.</div>
                        <div class="error-modal-msg">{placeOrderErrorMsg}</div>
                        <div class="error-modal-contact">
                            <a href="mailto:contact@americanbookcompany.com" class="contact-link">
                                <lightning-icon icon-name="utility:email" size="xx-small" class="contact-icon"></lightning-icon>
                                contact@americanbookcompany.com
                            </a>
                            <br />
                            <a href="tel:18882645877" class="contact-link">
                                <lightning-icon icon-name="utility:call" size="xx-small" class="contact-icon"></lightning-icon>
                                1-888-264-5877
                            </a>
                        </div>
                    </div>
                    <div class="error-modal-actions">
                        <button type="button" class="btn-primary btn-modal-ok" onclick={closeErrorModal}>Ok</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- ═══════════════════════════════════════════════════════
             PAYMENT MODAL — Authorize.Net Accept Hosted (iFrame)
             Opens over the checkout page; user never leaves the site
        ════════════════════════════════════════════════════════════ -->
        <template if:true={showPaymentModal}>
            <div class="an-modal-backdrop" role="dialog" aria-modal="true" aria-label="Secure Payment">
                <div class={paymentModalContainerClass}>

                    <!-- Modal header -->
                    <div class="an-modal-header">
                        <span class="an-modal-title">Secure Payment</span>
                        <div class="an-modal-header-actions">
                            <button type="button" class="an-modal-expand" onclick={handleTogglePaymentExpand}
                                aria-label={paymentExpandLabel} title={paymentExpandLabel}>
                                <template if:false={isPaymentExpanded}>&#x26F6;</template>
                                <template if:true={isPaymentExpanded}>&#x2750;</template>
                            </button>
                            <button type="button" class="an-modal-close" onclick={handleClosePaymentModal}
                                aria-label="Close payment modal" title="Close">
                                &#x2715;
                            </button>
                        </div>
                    </div>

                    <!-- AN hosted form loads here -->
                    <div class="an-modal-body">
                        <iframe
                            class="an-payment-iframe"
                            title="Authorize.Net Secure Payment"
                            name="an-payment-iframe"
                            src="about:blank"
                            frameborder="0"
                            scrolling="auto"
                            allowpaymentrequest>
                        </iframe>
                    </div>

                    <!-- Placing order overlay — shown after AN confirms payment -->
                    <template if:true={isPlacingOrderAfterPayment}>
                        <div class="an-placing-overlay">
                            <lightning-spinner alternative-text="Placing your order" size="medium"></lightning-spinner>
                            <p class="an-placing-text">Placing your order&hellip;</p>
                        </div>
                    </template>

                </div>
            </div>
        </template>

        <!-- ═══════════════════════════════════════════════════════
             ORDER SUCCESS SCREEN — shown after placeOrder succeeds
        ════════════════════════════════════════════════════════════ -->
        <template if:true={orderPlaced}>
            <div class="order-success-overlay" onclick={handleOrderSuccessClose}>
                <div class="order-success-card" onclick={stopPropagation}>
                    <div class="order-success-icon">&#10003;</div>
                    <h2 class="order-success-title">Order Placed Successfully!</h2>
                    <p class="order-success-msg">
                        Thank you for your purchase. Your payment has been processed and your
                        order has been created in our system.
                    </p>
                    <template if:true={orderNumber}>
                        <p class="order-success-ref">Order reference: <strong>{orderNumber}</strong></p>
                    </template>
                    <p class="order-success-msg">
                        You will receive a confirmation email shortly.
                    </p>
                    <div class="order-success-actions">
                        <button type="button" class="btn-primary" onclick={handleViewOrder}>
                            View My Order
                        </button>
                        <button type="button" class="btn-secondary order-success-continue" onclick={handleOrderSuccessClose}>
                            Continue Shopping
                        </button>
                    </div>
                </div>
            </div>
        </template>

    </div>
</template>
