<template>
  <section class="wrap">

    <!-- Row 1: spans both columns (colspan) -->
    <div class="badges-row">
      <template for:each={badges} for:item="badge">
        <img
          key={badge.key}
          class="badge-img"
          src={badge.src}
          alt={badge.alt}
        />
      </template>
    </div>

    <!-- Row 2, Col 1 (50%): Need help card -->
    <div class="help-card" style={helpCardStyle}>
      <p class="help-heading">Need help?</p>
      <p class="help-text">
        Your {selectedState} representatives are here to personally help you
        determine the best solution for you.
      </p>
      <a class="help-btn" href="mailto:contact@americanbookcompany.com">Email Our Sales Team</a>
      <p class="help-contact">Phone: (888) 264-5877</p>
      <p class="help-contact">Fax: (866) 827-3240</p>
    </div>

    <!-- Row 2, Col 2 (50%): All reps in a single row -->
    <div class="reps-area">
      <template lwc:if={hasState}>
        <div class="grid">
          <template for:each={reps} for:item="rep">
            <div key={rep.key} class="rep">
              <img
                class="avatar"
                src={rep.imageUrl}
                alt={rep.name}
                data-statefolder={rep.stateFolder}
                data-imagebase={rep.imageBase}
                data-forceshared={rep.forceShared}
                data-try="0"
                onerror={handleImgError}
              /><!-- NOSONAR S6847 — onerror is a resource event, not a user interaction -->
              <div class="name">{rep.name}</div>
              <div class="role">{rep.title}</div>
              <div class="icons">
                <a class="iconBtn" href={rep.telHref} aria-label="Call">
                  <lightning-icon icon-name="utility:call" size="x-small"></lightning-icon>
                </a>
                <a class="iconBtn" href={rep.mailHref} aria-label="Email">
                  <lightning-icon icon-name="utility:email" size="x-small"></lightning-icon>
                </a>
              </div>
            </div>
          </template>
        </div>
      </template>
      <template lwc:else>
        <div class="empty">Select a State to see representatives.</div>
      </template>
    </div>

  </section>
</template>
