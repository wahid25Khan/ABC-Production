<template>
  <template if:true={isModalOpen}>
    <section
      class="map-modal"
      role="dialog"
      aria-modal="true"
      aria-label={modalTitle}
    >
      <button
        class="map-modal__backdrop"
        type="button"
        onclick={closeModal}
        aria-label="Close map modal"
      ></button>

      <div class="map-modal__panel">
        <button
          class="map-modal__close"
          type="button"
          onclick={closeModal}
          aria-label="Close expanded map"
        >
          ×
        </button>

        <div class="map-wrapper map-wrapper--modal">
          <div class="header">
            <div class="marker-block">
              <span class="marker yellow"></span>
              <span class="marker red"></span>
              <span class="marker gray"></span>
            </div>
            <div class="title-wrap">
              <div class="title">{modalTitle}</div>
              <div class="subtitle">based on 3 years</div>
            </div>
          </div>

          <template if:true={errorMessage}>
            <div class="error">{errorMessage}</div>
          </template>

          <div
            class="map map--modal"
            data-map-role="modal"
            lwc:dom="manual"
          ></div>

          <div class="state-watermark">{stateWatermark}</div>

          <div class="legend">
            <div class="legend-title">① N° District Total</div>
            <template for:each={legendRows} for:item="entry">
              <div class="legend-row" key={entry.key}>
                <span class="swatch" style={entry.swatchStyle}></span>
                <span>{entry.rangeLabel}</span>
                <span>Range</span>
              </div>
            </template>
          </div>

          <img src={logoUrl} alt="Logo" class="abc-logo" />
        </div>
      </div>
    </section>
  </template>

  <template if:true={isLoading}>
    <div class="spinner-container">
      <lightning-spinner
        alternative-text="Loading"
        size="medium"
      ></lightning-spinner>
    </div>
  </template>

  <template if:false={isLoading}>
    <div class="carousel-wrapper">
      <div class="swiper-shell">
        <div class="swiper" lwc:ref="swiperContainer">
          <div class="swiper-wrapper">
            <template for:each={formattedSlides} for:item="slide">
              <template if:true={slide.isMapCard}>
                <article key={slide.Id} class={cardClass}>
                  <button
                    if:true={isExpandable}
                    type="button"
                    class="card-hit-area"
                    onclick={openModal}
                    aria-label={expandButtonLabel}
                    title={expandButtonLabel}
                  >
                    <span class="assistive-text">{expandButtonLabel}</span>
                  </button>

                  <div class="map-card__media">
                    <template if:true={errorMessage}>
                      <div class="error error--card">{errorMessage}</div>
                    </template>

                    <div
                      class="map map--card"
                      data-map-role="preview"
                      lwc:dom="manual"
                    ></div>
                  </div>

                  <div class="map-card__caption">{compactTitle}</div>
                </article>
              </template>

              <template if:false={slide.isMapCard}>
                <div key={slide.Id} class="swiper-slide card">
                  <div class="top-media-section">
                    <template if:true={slide.isVideo}>
                      <iframe
                        src={slide.Video_URL__c}
                        class="video-iframe"
                      ></iframe>
                    </template>
                    <template if:true={slide.isText}>
                      <div class="quote-text">
                        "{slide.Testimonial_Text__c}"
                      </div>
                    </template>
                  </div>
                  <div class="bottom-author-section">
                    <div class="logo-container">
                      <img src={logoUrl} alt="Logo" class="logo-img" />
                    </div>
                    <div class="author-details">
                      <div class="author-name">{slide.Author_Name__c}</div>
                      <div class="school-name">{slide.School_Name__c}</div>
                    </div>
                  </div>
                </div>
              </template>
            </template>
          </div>
        </div>

        <button
          class="swiper-button-prev"
          type="button"
          aria-label="Previous slide"
        ></button>
        <button
          class="swiper-button-next"
          type="button"
          aria-label="Next slide"
        ></button>
      </div>
    </div>
  </template>
</template>
