<template>
    <template lwc:if={hasArticle}>
        <div class="flex-1 pb-16 md-mr-4">
            <div class="bg-abc-gray p-4">
                <h1 class="font-bold text-2xl md-text-3xl md-leading-h1 mb-2 text-center">
                    {title}
                </h1>
                <template lwc:if={showMeta}>
                    <div class="article-meta mb-2 text-center md-mb-0 md-text-lg">
                        <template lwc:if={hasExcerpt}>
                            <div class="md-inline">{excerpt}</div>
                        </template>
                        <template lwc:if={hasPublishedDate}>
                            <div class="published-date">{publishedDateLabel}</div>
                        </template>
                    </div>
                </template>
                <template lwc:if={hasImage}>
                    <div class="flex justify-center md-px-8 md-py-4">
                        <img
                            src={imageUrl}
                            alt={imageAlt}
                            class="max-h-600 overflow-hidden rounded-2xl"
                        />
                    </div>
                </template>
            </div>
            <div class="article-body blog-post-detail-body prose mx-auto max-w-none md-max-w-3xl xl-max-w-4xl">
                <template lwc:if={hasBody}>
                    <lightning-formatted-rich-text value={bodyHtml}></lightning-formatted-rich-text>
                </template>
            </div>
        </div>
    </template>
    <template lwc:elseif={errorMessage}>
        <div class="message-state">{errorMessage}</div>
    </template>
    <template lwc:else>
        <div class="message-state">
            Loading article...
        </div>
    </template>
</template>
