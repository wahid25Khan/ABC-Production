<template>
  <section class="hero-section">
    <div class="hero-inner">
      <div class="hero-text-rail">
        <div class="hero-copy">
          <h1 class="hero-heading">Who We Are</h1>
          <p class="hero-body">
            American Book Company (ABC) was created by two educators who saw a need
            to improve the selection of quality educational resources in the
            classroom. That vision has driven us to create innovative content that
            has helped students achieve success in and out of the classroom for over
            30 years. We pride ourselves in writing books that are accurate,
            effective, easy-to-read, and engaging for students and teachers alike,
            across all subjects - Mathematics, English Language Arts, Science, and
            Social Studies.
          </p>
        </div>

        <div class="hero-stats" aria-label="American Book Company statistics">
          <div class="stat-card">
            <div class="stat-number">30<span class="stat-plus">+</span></div>
            <div class="stat-label">Years in Business</div>
          </div>
          <div class="stat-card stat-card--offset">
            <div class="stat-number">5395</div>
            <div class="stat-label">Schools Served</div>
          </div>
        </div>
      </div>

      <div class="hero-image-col">
        <img src={heroImage} alt="About Us Hero" class="hero-img" />
      </div>
    </div>
  </section>

  <nav class="section-nav" aria-label="About page sections">
    <ul class="section-nav-inner">
      <template for:each={tabList} for:item="tab">
        <li key={tab.key} class="section-nav-item">
          <button
            type="button"
            class={tab.className}
            data-key={tab.key}
            onclick={handleTabClick}
          >
            {tab.label}
          </button>
        </li>
      </template>
    </ul>
  </nav>

  <section id="ourStaff" data-section="ourStaff" class="panel">
    <div class="panel-inner">
      <h2 class="panel-heading">Our Staff</h2>
      <div
        class="carousel-shell carousel-shell--staff"
        data-carousel="staff"
        ontouchstart={handleCarouselTouchStart}
        ontouchmove={handleCarouselTouchMove}
        ontouchend={handleCarouselTouchEnd}
        ontouchcancel={handleCarouselTouchCancel}
      >
        <button
          type="button"
          class="carousel-arrow"
          aria-label="Previous staff members"
          onclick={handleStaffPrevious}
        >
          &#8249;
        </button>

        <div class="staff-track" style={staffTrackStyle}>
          <template for:each={visibleStaffMembers} for:item="member">
            <article key={member.id} class="staff-card">
              <div class="staff-avatar-wrap">
                <img
                  src={member.image}
                  alt={member.name}
                  class="staff-photo"
                  loading="lazy"
                />
              </div>
              <div class="staff-name">{member.name}</div>
              <div class="staff-title">{member.title}</div>
              <div class="staff-actions">
                <template if:true={member.phone}>
                  <a href={member.phone} aria-label={member.name}>
                    <img src={phoneIconUrl} alt="" class="staff-icon" />
                  </a>
                </template>
                <template if:true={member.email}>
                  <a href={member.email} aria-label={member.name}>
                    <img src={mailIconUrl} alt="" class="staff-icon" />
                  </a>
                </template>
              </div>
            </article>
          </template>
        </div>

        <button
          type="button"
          class="carousel-arrow"
          aria-label="Next staff members"
          onclick={handleStaffNext}
        >
          &#8250;
        </button>
      </div>
    </div>
  </section>

  <section
    id="diversityAndCulture"
    data-section="diversityAndCulture"
    class="panel panel--muted"
  >
    <div class="panel-inner diversity-layout">
      <div class="diversity-copy">
        <h2 class="panel-heading panel-heading--left">Diversity &amp; Culture</h2>
        <template for:each={diversityParagraphs} for:item="item">
          <p key={item.id} class="panel-copy">{item.paragraph}</p>
        </template>
      </div>

      <div class="diversity-image-wrap">
        <picture>
          <source media="(max-width: 767px)" srcset={diversityMobileImage} />
          <img
            src={diversityDesktopImage}
            alt="Diversity and culture at American Book Company"
            class="diversity-image"
          />
        </picture>
      </div>
    </div>
  </section>

  <section id="abcCares" data-section="abcCares" class="panel">
    <div class="panel-inner">
      <h2 class="panel-heading">ABC Cares</h2>
      <p class="panel-copy panel-copy--center">
        ABC cares about our communities and the schools we serve. We know that
        curriculum is only one part of student success and that strong
        communities and make all the difference. In our home state of Georgia
        and the other states we serve, we believe in being part of those strong
        communities.
      </p>
      <p class="panel-copy panel-copy--center panel-copy--spaced">
        From backpack drives to charity tournaments to helping students and
        teachers get back on their feet after natural disasters, we will be here
        to help.
      </p>

      <div
        class="carousel-shell"
        data-carousel="abcCares"
        ontouchstart={handleCarouselTouchStart}
        ontouchmove={handleCarouselTouchMove}
        ontouchend={handleCarouselTouchEnd}
        ontouchcancel={handleCarouselTouchCancel}
      >
        <button
          type="button"
          class="carousel-arrow"
          aria-label="Previous ABC Cares story"
          onclick={handleAbcCaresPrevious}
        >
          &#8249;
        </button>

        <article class="feature-card">
          <div class="feature-media">
            <img
              src={currentAbcCaresItem.image}
              alt={currentAbcCaresItem.title}
              class="feature-image"
              loading="lazy"
            />
          </div>

          <div class="feature-content">
            <img src={bubbleImage} alt="" class="feature-bubbles" />
            <div class="feature-copy-block">
              <h3 class="feature-heading">{currentAbcCaresItem.title}</h3>
              <p class="feature-text">{currentAbcCaresItem.text}</p>
            </div>
          </div>
        </article>

        <button
          type="button"
          class="carousel-arrow"
          aria-label="Next ABC Cares story"
          onclick={handleAbcCaresNext}
        >
          &#8250;
        </button>
      </div>
    </div>
  </section>

  <section id="environment" data-section="environment" class="panel panel--muted">
    <div class="panel-inner">
      <h2 class="panel-heading">Environment</h2>
      <p class="panel-copy panel-copy--center">
        ABC cares about the impact of our manufacturing processes and we take
        efforts to reduce energy consumption and waste.
      </p>

      <div
        class="carousel-shell"
        data-carousel="environment"
        ontouchstart={handleCarouselTouchStart}
        ontouchmove={handleCarouselTouchMove}
        ontouchend={handleCarouselTouchEnd}
        ontouchcancel={handleCarouselTouchCancel}
      >
        <button
          type="button"
          class="carousel-arrow"
          aria-label="Previous environment story"
          onclick={handleEnvironmentPrevious}
        >
          &#8249;
        </button>

        <article class="feature-card">
          <div class="feature-media">
            <img
              src={currentEnvironmentItem.image}
              alt={currentEnvironmentItem.title}
              class="feature-image"
              loading="lazy"
            />
          </div>

          <div class="feature-content">
            <img src={bubbleImage} alt="" class="feature-bubbles" />
            <div class="feature-copy-block">
              <h3 class="feature-heading">{currentEnvironmentItem.title}</h3>
              <p class="feature-text">{currentEnvironmentItem.text}</p>
            </div>
          </div>
        </article>

        <button
          type="button"
          class="carousel-arrow"
          aria-label="Next environment story"
          onclick={handleEnvironmentNext}
        >
          &#8250;
        </button>
      </div>
    </div>
  </section>

  <section
    id="testimonials"
    data-section="testimonials"
    class="panel panel--muted testimonials-panel"
  >
    <div class="panel-inner panel-inner--wide">
      <div class="quote-banner">
        <p class="quote-banner-text">
          "everything the student needs... self-explanatory... wonderful books."
        </p>
        <p class="quote-banner-attribution">
          - Joyce Harvey, McDonough High School, Louisiana
        </p>
      </div>

      <h2 class="panel-heading">Testimonials</h2>

      <div class="testimonial-grid">
        <template for:each={testimonials} for:item="item">
          <article key={item.id} class="testimonial-card">
            <div class="testimonial-video-wrap">
              <iframe
                src={item.video}
                title={item.name}
                class="testimonial-video"
                loading="lazy"
                allow={iframeAllow}
                allowfullscreen
              ></iframe>
            </div>

            <div class="testimonial-card-body">
              <img src={testimonialIconUrl} alt="" class="testimonial-icon" />
              <div class="testimonial-copy">
                <div class="testimonial-name">{item.name}</div>
                <template if:true={item.school}>
                  <div class="testimonial-school">{item.school}</div>
                </template>
                <template if:true={item.state}>
                  <div class="testimonial-state">{item.state}</div>
                </template>
              </div>
            </div>
          </article>
        </template>
      </div>
    </div>
  </section>
</template>
