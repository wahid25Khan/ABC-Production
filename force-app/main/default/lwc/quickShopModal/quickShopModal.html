<template>
        <dialog
            class="slds-modal slds-fade-in-open"
            open
            aria-modal="true"
            aria-labelledby="modalHeading"
        >
            <div class="slds-modal__container modal-container">
                <!-- Header -->
                <header class="modal-header">
                    <button class="close-btn" type="button" onclick={handleClose} aria-label="Close">
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    </button>
                </header>

                <!-- Body -->
                <div class="modal-body">
                    <template if:true={isLoading}>
                        <div class="loader-container">
                            <lightning-spinner alternative-text="Loading product details" size="medium"></lightning-spinner>
                        </div>
                    </template>
                    <template if:false={isLoading}>
                    <div class="content-grid">
                        <!-- Left: Cover -->
                        <div class="left-col">
                            <div class="cover-frame">
                                <template if:true={bookImageUrl}>
                                    <img src={bookImageUrl} alt="Book cover" class="cover-img" />
                                </template>
                                <template if:false={bookImageUrl}>
                                    <div class="cover-placeholder">
                                        <lightning-icon icon-name="utility:image" size="large"></lightning-icon>
                                        <div class="ph-text">Book Cover</div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Right: Details -->
                        <div class="right-col">
                            <div class="header-text">
                        <h2 id="modalHeading" class="title">{title}</h2>
                        <div class="subtitle">{isbn}</div>
                    </div>
                    <div class="divider"></div>
                            <!-- Tabs -->
                            <div class="plan-toggle" role="tablist" aria-label="Format Options">
                                <template if:true={isColorSelected}>
                                    <button class={planClassColor} type="button" onclick={selectColorPlan} role="tab" aria-selected="true">
                                        Color Print + Digital
                                    </button>
                                </template>
                                <template if:false={isColorSelected}>
                                    <button class={planClassColor} type="button" onclick={selectColorPlan} role="tab" aria-selected="false">
                                        Color Print + Digital
                                    </button>
                                </template>

                                <template if:true={isBwSelected}>
                                    <button class={planClassBw} type="button" onclick={selectBwPlan} role="tab" aria-selected="true">
                                        B&amp;W Print + Digital
                                    </button>
                                </template>
                                <template if:false={isBwSelected}>
                                    <button class={planClassBw} type="button" onclick={selectBwPlan} role="tab" aria-selected="false">
                                        B&amp;W Print + Digital
                                    </button>
                                </template>
                            </div>

                            

                            <!-- Pricing + Features -->
                            <div class="row-split">
                                <!-- Price table -->
                                <div class="price-card">
                                    <div class="price-table-head">
                                        <div class="th">Quantity</div>
                                        <div class="th">Price</div>
                                    </div>
                                    <div class="price-row">
                                        <div class="td">{standardQtyRange}</div>
                                        <div class="td price">{formattedStandardPrice}</div>
                                    </div>
                                    <template if:true={hasBulkPrice}>
                                        <div class="price-row">
                                            <div class="td">{bulkQtyRange}</div>
                                            <div class="td price price-red">{formattedBulkPrice}</div>
                                        </div>
                                    </template>
                                </div>

                                <!-- Features (exact layout like image) -->
                                <div class="feature-cols">
                                    <div class="feature-col">
                                        <template for:each={featuresLeft} for:item="f">
                                            <div key={f} class="feature-item">
                                                <lightning-icon
                                                    icon-name="utility:check"
                                                    size="x-small"
                                                    class="check-icn"
                                                ></lightning-icon>
                                                <span>{f}</span>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="feature-col right">
                                        <template for:each={featuresRight} for:item="f">
                                            <div key={f} class="feature-item">
                                                <lightning-icon
                                                    icon-name="utility:check"
                                                    size="x-small"
                                                    class="check-icn"
                                                ></lightning-icon>
                                                <span>{f}</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <!-- Action strip -->
                            <div class="action-strip">
                                <div class="btns">
                                  <div class="qty-wrap">
                                    <div class="qty-label">Quantity (min {minQty})</div>
                                    <div class="qty-stepper">
                                        <button type="button" class="qty-btn" onclick={handleQtyDecrement} disabled={isMinQty} aria-label="Decrease quantity">&minus;</button>
                                        <input type="number"
                                            value={quantity}
                                            min={minQty}
                                            max={maxQty}
                                            step={incrementQty}
                                            oninput={handleQtyChange}
                                            class="qty-input"
                                        ></input>
                                        <button type="button" class="qty-btn" onclick={handleQtyIncrement} disabled={isMaxQty} aria-label="Increase quantity">&plus;</button>
                                    </div>

                                    </div>
                                    <div class="btn-offset">
                                    <button 
                                        class="btn-add"
                                        onclick={handleAddToCart}>
                                            Add to Cart
                                    </button>
                                    </div>
                                    <div class="btn-offset">
                                    <button 
                                        class="btn-trial"
                                        onclick={handleTrial}>
                                            FREE Two-Week Trial!
                                    </button>
                                    </div>
                                    <button
                                        class="heart-btn"
                                        type="button"
                                        title="Save to favorites"
                                        aria-label="Save to favorites"
                                        onclick={toggleFavorite}>
                                        <lightning-icon icon-name={heartIcon} size="small"></lightning-icon>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom full-width button -->
                    <div class="footer-cta">
                        <button class="details-btn" type="button" onclick={handleViewDetails}>
                            See Full Product Details
                        </button>
                    </div>
                    </template>
                </div>
            </div>
        </dialog>

        <!-- Backdrop -->
        <button type="button" class="slds-backdrop slds-backdrop_open" onclick={handleBackdropClick} aria-label="Close modal"></button>
</template>
