<template>
    <section class="recent-blogs container mb-10 lg-px-20">
        <div class="recent-blogs-header my-10">
            <div class="recent-blogs-header-spacer" aria-hidden="true"></div>

            <h2 class="recent-blogs-title text-center text-3xl font-bold">Recent Posts</h2>

            <div class="abc-search-wrap recent-blogs-search-wrap">
                <input
                    type="text"
                    class="abc-search-input"
                    placeholder="Search Articles..."
                    value={searchTerm}
                    oninput={handleSearchInput}
                    aria-label="Search recent posts"
                />
                <template if:true={showClearSearchButton}>
                    <button
                        type="button"
                        class="abc-search-icon-button"
                        onclick={handleClearSearch}
                        aria-label="Clear search"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            class="abc-search-svg"
                            focusable="false"
                            fill="none"
                            aria-hidden="true"
                        >
                            <path
                                d="M6 6l12 12M18 6 6 18"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            />
                        </svg>
                    </button>
                </template>
                <template if:false={showClearSearchButton}>
                    <span class="abc-search-icon" aria-hidden="true">
                        <svg
                            viewBox="0 0 24 24"
                            class="abc-search-svg"
                            focusable="false"
                            fill="currentColor"
                        >
                            <path
                                d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                            />
                        </svg>
                    </span>
                </template>
            </div>
        </div>

        <template if:true={errorMessage}>
            <div class="status-card" role="alert">
                <p>{errorMessage}</p>
                <button type="button" class="btn-read-more status-button" onclick={handleRetryClick}>
                    Try Again
                </button>
            </div>
        </template>

        <template if:true={isLoading}>
            <div class="status-card" aria-live="polite">
                <p>Loading recent posts...</p>
            </div>
        </template>

        <template if:true={hasBlogs}>
            <template for:each={blogs} for:item="blog">
                <article key={blog.id} class="blog-card mx-auto mb-6 overflow-hidden rounded-xl border p-6 shadow-xl md-flex md-h-72">
                    <div class="blog-media h-60 flex-none overflow-hidden text-center md-h-full md-w-2-5 md-pr-8">
                        <a href={blog.href} class="blog-image-link">
                            <template if:true={blog.hasImage}>
                                <img src={blog.imageUrl} alt={blog.imageAlt} class="blog-image">
                            </template>
                            <template if:false={blog.hasImage}>
                                <div class="blog-image blog-image-fallback">
                                    <span>ABC Blog</span>
                                </div>
                            </template>
                        </a>
                    </div>

                    <div class="blog-copy flex-1 pt-2 md-pt-0">
                        <template if:true={blog.publishedDateLabel}>
                            <p class="blog-date">{blog.publishedDateLabel}</p>
                        </template>

                        <h3 class="mb-4 text-xl font-bold">
                            <a href={blog.href} class="blog-title-link">{blog.title}</a>
                        </h3>

                        <p class="blog-excerpt">{blog.excerpt}</p>

                        <div class="pt-6 md-pt-4">
                            <a href={blog.href} class="btn-read-more">
                                Read More
                            </a>
                        </div>
                    </div>
                </article>
            </template>
        </template>

        <template if:true={showEmptyState}>
            <div class="status-card">
                <p>{emptyStateMessage}</p>
            </div>
        </template>

        <template if:true={hasPagination}>
            <div class="pagination mt-14 text-center md-text-right">
                <button
                    type="button"
                    class={previousButtonClass}
                    onclick={handlePreviousClick}
                    disabled={isPreviousDisabled}
                    aria-label="Previous page"
                >
                    <span class="pagination-circle">
                        <svg class="pagination-icon" viewBox="0 0 12 12" aria-hidden="true">
                            <path d="M7.5 2.25 3.75 6l3.75 3.75" />
                        </svg>
                    </span>
                </button>

                <div class="inline-block px-4 page-label">{pageLabel}</div>

                <button
                    type="button"
                    class={nextButtonClass}
                    onclick={handleNextClick}
                    disabled={isNextDisabled}
                    aria-label="Next page"
                >
                    <span class="pagination-circle">
                        <svg class="pagination-icon" viewBox="0 0 12 12" aria-hidden="true">
                            <path d="M4.5 2.25 8.25 6 4.5 9.75" />
                        </svg>
                    </span>
                </button>
            </div>
        </template>
    </section>
</template>
